spring.application.name=LabSchedule

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=kornec_flow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=kornec_flow

# Schema init
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT
app.jwt.secret=${JWT_SECRET:defaultSecretKeyAtLeast256BitsLongForHS256AlgorithmSecurity}
app.jwt.expiration-ms=86400000

# Admin
app.admin.username=${ADMIN_USERNAME:kornecAdmin}
app.admin.password=${ADMIN_PASSWORD:kornec!123}
